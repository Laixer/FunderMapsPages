<header data-active-nav="{{ active }}" x-data="mobileMenu" class="lg:mb-11">
  <div class="wrapper | flex justify-between items-center pt-16 pb-10 lg:py-0">

    <a class="logo pt-1.5" href="/">
      <include src="./resources/svg/logo/fundermaps-logo.svg"></include>
      <span class="sr-only">FunderMaps</span>
    </a>

    <!-- Desktop navigation -->
    <nav class="hidden lg:flex items-center" aria-label="Hoofdnavigatie">
      <ul class="menu | ">
        <li class="menu-item | px-4">
          <a class="no-underline" data-nav-key="intro" title="Intro" href="/#hero">Intro</a>
        </li>
        <li class="menu-item | px-4">
          <a class="no-underline" data-nav-key="services" title="Services" href="/#services">Services</a>
        </li>
        <li class="menu-item | px-4">
          <a class="no-underline" data-nav-key="references" title="Referenties" href="/#references-anchor">Referenties</a>
        </li>
        <li class="menu-item | px-4">
          <a class="no-underline" data-nav-key="demo" title="Voorbeeld" href="/#preview">Voorbeeld</a>
        </li>
        <li class="menu-item | px-4">
          <a class="no-underline" data-nav-key="partners" title="Partners" href="/#partners">Partners</a>
        </li>
        <li class="menu-item | px-4">
          <a class="no-underline" data-nav-key="artikelen" title="Artikelen" href="artikelen.html">Artikelen</a>
        </li>
      </ul>

      <a class="button button-secondary ml-4" href="mailto:info@fundermaps.com">
        <div class="inline-block">
          <img class="w-8 mr-1" src="./resources/images/contactpersoon.webp" height="64" width="64" alt="">
        </div>
        <span>Direct contact</span>
        <div class="button-arrow">
          <include src="./resources/svg/arrow-right-icon.svg"></include>
        </div>
      </a>
    </nav>

    <!-- Mobile navigation: Toggle menu -->
    <div class="inline-flex lg:hidden">
      <button x-on:click="open = true" class="flex items-center justify-center w-11 h-11 -mr-2 text-blue-900 hover:text-yellow-500" aria-label="Open mobiel menu">
        <div x-show="! open">
          <include src="./resources/svg/hamburger-icon.svg"></include>
        </div>
      </button>
    </div>
  </div>

  <!-- Mobile navigation: dropdown -->
  <div x-cloak x-dialog x-model="open" x-transition:enter="left ease-out duration-300, right ease-out duration-300"
    x-transition:enter-start="opacity-100 left-full -right-full" x-transition:enter-end="opacity-100 left-0 right-0"
    x-transition:leave="left ease-in duration-100, right ease-in duration-100"
    x-transition:leave-start="opacity-100 left-0 right-0" x-transition:leave-end="opacity-100 left-full -right-full"
    class="top-0 bottom-0 fixed z-10 w-full h-full bg-blue-900 overflow-auto lg:hidden">

    <div x-dialog:panel>
      <div class="sticky top-0 bg-blue-900 flex justify-between items-center px-5 pt-16 z-10">
        <div class="pt-1.5">
          <include src="./resources/svg/logo/fundermaps-logo-white.svg"></include>
        </div>

        <button x-on:click="open = false" class="flex items-center justify-center w-11 h-11 -mr-2" aria-label="Sluit mobiel menu">
          <include src="./resources/svg/arrow-right-icon.svg"></include>
        </button>
      </div>

      <nav x-data class="grid pt-16 lg:hidden" aria-label="Mobiele navigatie">
        <ul class="menu-mobile | ">
          <li class="menu-item">
            <a class="no-underline" data-nav-key="intro" title="Intro" href="/#hero" x-on:click="open = false">Intro</a>
          </li>
          <li class="menu-item">
            <a class="no-underline" data-nav-key="services" title="Services" href="/#services" x-on:click="open = false">Services</a>
          </li>
          <li class="menu-item">
            <a class="no-underline" data-nav-key="references" title="Referenties" href="/#references-anchor" x-on:click="open = false">Referenties</a>
          </li>
          <li class="menu-item">
            <a class="no-underline" data-nav-key="demo" title="Voorbeeld" href="/#preview" x-on:click="open = false">Voorbeeld</a>
          </li>
          <li class="menu-item">
            <a class="no-underline" data-nav-key="partners" title="Partners" href="/#partners" x-on:click="open = false">Partners</a>
          </li>
          <li class="menu-item">
            <a class="no-underline" data-nav-key="artikelen" title="Artikelen" href="artikelen.html" x-on:click="open = false">Artikelen</a>
          </li>
          <li class="pl-16">
            <a class="button button-outline-primary mt-10" href="https://www.linkedin.com/company/26521848/" target="_blank" rel="noopener" x-on:click="open = false">
              <div class="button-logo">
                <include src="./resources/svg/linkedin-logo.svg"></include>
              </div>
              <span class="sr-only">FunderMaps op LinkedIn</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <div class="fixed top-0 left-0 right-0 bottom-0 overflow-hidden -z-10">
      <div class="absolute rotate-90 -scale-x-100 -bottom-[238px] -right-[294px] w-[863px] opacity-20">
        <include src="./resources/svg/hero-bg.svg"></include>
      </div>
    </div>
  </div>
</header>
